<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheDailyPoop - Track, Share, Compete</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }
        
        .logo {
            font-size: 120px;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        
        .download-btn {
            display: inline-block;
            background: #FFD700;
            color: #000;
            padding: 20px 50px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }
        
        .features {
            margin-top: 60px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }
        
        .feature {
            font-size: 48px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💩</div>
        <h1>TheDailyPoop</h1>
        <p>Track your poops on a map, share with friends, and compete on leaderboards!</p>
        <a href="https://apps.apple.com/app/thedailypoop/id6739120902" class="download-btn">
            📱 Download on App Store
        </a>
        
        <div class="features">
            <div class="feature">📍</div>
            <div class="feature">👥</div>
            <div class="feature">🏆</div>
            <div class="feature">💨</div>
        </div>
    </div>
</body>
</html>
