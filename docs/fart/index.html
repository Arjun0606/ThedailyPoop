<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A secret message is waiting for you...</title>
    <meta property="og:title" content="A Secret Message For You">
    <meta property="og:description" content="Tap to see what your friend sent you...">
    <meta property="og:image" content="https://arjun0606.github.io/ThedailyPoop/icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }
        
        /* Initial loading state - looks innocent */
        #loading {
            text-align: center;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Prank reveal - shows after sound */
        #reveal {
            display: none;
            text-align: center;
            padding: 20px;
            max-width: 500px;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        #reveal.show {
            display: block;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .emoji {
            font-size: 120px;
            animation: bounce 0.6s ease-in-out infinite;
            display: inline-block;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.1); }
        }
        
        h1 {
            font-size: 42px;
            font-weight: 900;
            margin: 20px 0 10px;
            text-shadow: 2px 2px 8px rgba(255, 215, 0, 0.5);
            color: #FFD700;
        }
        
        .sender {
            font-size: 24px;
            font-weight: 700;
            color: #FF6B6B;
            margin-bottom: 30px;
        }
        
        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            padding: 18px 40px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
            margin: 20px 10px;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.6);
        }
        
        .download-btn.secondary {
            background: transparent;
            border: 2px solid #FFD700;
            color: #FFD700;
        }
        
        .message {
            font-size: 16px;
            line-height: 1.6;
            margin: 20px 0;
            opacity: 0.9;
        }
        
        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #FFD700;
            position: fixed;
            animation: confetti-fall 3s linear;
        }
        
        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Initial innocent loading screen -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>
    
    <!-- PRANK REVEAL (shows after fart plays) -->
    <div id="reveal">
        <div class="emoji">💨</div>
        <h1>FART ATTACKED!</h1>
        <div class="sender">by <span id="senderName">@prankster</span></div>
        
        <div class="message">
            😂 You just got pranked!<br>
            Want revenge? Blast them back in 5 seconds.
        </div>
        
        <a href="https://apps.apple.com/app/thedailypoop/id6739120902" class="download-btn" id="downloadBtn">
            🚀 Get revenge now
        </a>
        
        <a href="#" class="download-btn secondary" id="replayBtn">
            🔊 Replay
        </a>
        
        <a href="#" class="download-btn secondary" id="shareBtn">
            📤 Send this to a friend
        </a>
    </div>
    
    <!-- Hidden audio player - auto-plays immediately -->
    <audio id="audioPlayer" preload="auto">
        <source src="https://arjun0606.github.io/ThedailyPoop/sounds/fart_long_epidemic.wav" type="audio/wav">
        <source src="../sounds/fart_long_epidemic.wav" type="audio/wav">
    </audio>
    
    <script>
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const attackID = urlParams.get('id') || 'test';
        const senderUsername = urlParams.get('sender') || 'prankster';
        
        // Update sender name
        document.getElementById('senderName').textContent = '@' + senderUsername;
        
        const audio = document.getElementById('audioPlayer');
        const loading = document.getElementById('loading');
        const reveal = document.getElementById('reveal');
        let hasPlayed = false;
        
        // THE PRANK: Play sound immediately and subtly
        function triggerPrank() {
            if (hasPlayed) return;
            hasPlayed = true;
            
            // Play the fart sound!
            audio.volume = 1.0; // Full volume for maximum prank!
            audio.play().then(() => {
                console.log('🔊 FART PLAYING!');
                
                // After 1 second of sound, reveal the message
                setTimeout(() => {
                    loading.classList.add('hidden');
                    reveal.classList.add('show');
                    createConfetti();
                }, 1000);
                
            }).catch((error) => {
                console.log('Autoplay blocked, trying on click:', error);
                // If autoplay blocked, wait for any user interaction
                document.body.addEventListener('click', function playOnce() {
                    audio.play();
                    setTimeout(() => {
                        loading.classList.add('hidden');
                        reveal.classList.add('show');
                        createConfetti();
                    }, 1000);
                }, { once: true });
            });
        }
        
        // Try to play immediately on page load
        window.addEventListener('load', triggerPrank);
        
        // Also try on first interaction (backup)
        document.addEventListener('click', triggerPrank, { once: true });
        document.addEventListener('touchstart', triggerPrank, { once: true });
        
        // Replay button
        document.getElementById('replayBtn').addEventListener('click', function(e) {
            e.preventDefault();
            audio.currentTime = 0;
            audio.play();
        });
        
        // Download button tracking
        document.getElementById('downloadBtn').addEventListener('click', function() {
            console.log('User clicked revenge/download from fart attack:', attackID);
            // Track conversion (add analytics here)
        });
        
        // Share button - use Web Share API when available
        document.getElementById('shareBtn').addEventListener('click', async function(e) {
            e.preventDefault();
            const shareUrl = window.location.href;
            const text = `🤫 Tap to see a message from @${senderUsername}... ${shareUrl}`;
            if (navigator.share) {
                try {
                    await navigator.share({ title: 'A Secret Message For You', text, url: shareUrl });
                    console.log('Shared successfully');
                } catch (err) {
                    console.log('Share dismissed', err);
                }
            } else {
                try {
                    await navigator.clipboard.writeText(text);
                    alert('Link copied! Send it to a friend.');
                } catch (_) {
                    alert('Copy this link and share: ' + shareUrl);
                }
            }
        });
        
        // Confetti effect
        function createConfetti() {
            const colors = ['#FFD700', '#FFA500', '#FF6347', '#32CD32', '#1E90FF', '#FF69B4'];
            for (let i = 0; i < 30; i++) {
                setTimeout(function() {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }
        
        // Try to open app if installed (deep link)
        setTimeout(function() {
            const deepLink = 'thedailypoop://fart/' + attackID;
            window.location.href = deepLink;
        }, 2000);
    </script>
</body>
</html>
